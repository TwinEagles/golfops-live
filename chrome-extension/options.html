<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart Barn Live 2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 40px;
    }

    .card {
      width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Cart Barn Live 2</h1>
    <p>TwinEagles Club</p>

    <label for="email">Email</label>
    <input id="email" type="email" />

    <label for="password">Password</label>
    <input id="password" type="password" />

    <button id="login">Connect Extension</button>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
