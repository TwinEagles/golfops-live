<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GolfOps Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      margin: 36px auto;
      background: white;
      padding: clamp(22px, 6vw, 30px);
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GolfOps Live</h1>

    <p>TwinEagles Club</p>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
    />

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    />

    <button id="login">
      Connect Extension
    </button>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
